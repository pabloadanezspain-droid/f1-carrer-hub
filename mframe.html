<!doctype html><html><head><meta charset="utf-8"><title>Mobile frame</title><style>html,body{margin:0;background:#000}iframe{border:0;display:block}</style></head>
<body><iframe id="f" width="375"></iframe><script>
// Dev helper: renders a route inside a 375px-wide iframe for mobile screenshots. Usage: mframe.html?h=2400#/route
const q=new URLSearchParams(location.search);const f=document.getElementById('f');f.height=q.get('h')||1600;f.src='index.html'+location.hash;
</script></body></html>
